<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>保护怒江 - 守护最后的原生河流</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; }
        header { height: 80vh; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('nujiang.jpg') center/cover; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; line-height: 1.8; }
        .highlight { color: #2D6A4F; font-weight: bold; }
        .action-card { background: #1B4332; color: white; padding: 30px; border-radius: 15px; text-align: center; }
        button { background: #D4A373; border: none; padding: 15px 30px; color: white; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
    </style>
</head>
<body>
    <header>
        <h1>万物生长，怒江奔流</h1>
        <p>保护中国最后一条原生态大河</p>
    </header>
    <div class="container">
        <h2>为什么怒江不可替代？</h2>
        <p>在怒江大峡谷，海拔差可达 <span class="highlight">4000米</span> 以上，形成了“一山有四季，十里不同天”的奇观。它是全球生物多样性最丰富的地区之一。</p>
        
        <div class="action-card">
            <h3>参与保护行动</h3>
            <p>您的关注就是对这片山水最大的支持。</p>
            <button>捐助护林项目</button>
        </div>
    </div>
</body>
</html>
